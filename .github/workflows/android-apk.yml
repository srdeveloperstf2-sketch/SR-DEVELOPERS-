name: Build S.R. Developers Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'staff-control.css'
      - 'staff-control.js'
      - 'app.js'
      - 'emi.js'
      - 'notifications.js'
      - 'crm-insights.js'
      - 'auth.js'
      - 'partner.html'
      - 'partner.js'
      - 'partner-admin.js'
      - 'cloud-sync.js'
      - 'supabase/**'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'assets/**'
      - 'push-client.js'
      - 'sw.js'
      - 'tests/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'capacitor.config.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Validate CRM JavaScript syntax
        run: |
          node --check app.js
          node --check emi.js
          node --check cloud-sync.js
          node --check auth.js
          node --check staff-control.js
          node --check notifications.js
          node --check partner-admin.js
          node --check crm-insights.js
          node --check push-client.js
      - name: Run CRM security/notification regression tests
        run: node --test tests/*.test.js
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html partner.html styles.css staff-control.css staff-control.js app.js emi.js auth.js notifications.js push-client.js crm-insights.js partner.js partner-admin.js cloud-sync.js manifest.webmanifest icon.svg sw.js www/
          mkdir -p www/assets www/supabase
          cp assets/sr-developers-logo.svg www/assets/
          cp supabase/config.js www/supabase/config.js
      - name: Configure Firebase for Android push (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('google-services.json','utf8'));if(!j.project_info?.project_id||!j.client?.some(c=>c.client_info?.android_client_info?.package_name==='in.srdevelopers.crm')){console.error('Firebase JSON does not match Android package in.srdevelopers.crm');process.exit(2)}"
            echo "Firebase Android config validated."
          else
            echo "::warning::Missing GOOGLE_SERVICES_JSON_BASE64 GitHub secret. APK can build, but FCM push registration will not work on Android until Firebase config is added."
          fi
      - name: Create Android project
        run: npx cap add android
      - name: Copy Firebase config into Android app (when configured)
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK (retry transient Maven/Gradle resolution failures)
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if [ "$attempt" -eq 1 ]; then
              if ./gradlew --no-daemon --stacktrace assembleDebug; then exit 0; fi
            else
              echo "Refreshing Gradle dependency metadata for retry $attempt"
              if ./gradlew --no-daemon --refresh-dependencies --stacktrace assembleDebug; then exit 0; fi
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build attempt failed; retrying after 20 seconds."
              sleep 20
            fi
          done
          echo "::error::Android build failed after 3 attempts. See Gradle dependency resolution/compiler errors above."
          exit 1
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-Developers-CRM-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
