name: Build S.R. Developers Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'auth.js'
      - 'partner.html'
      - 'partner.js'
      - 'cloud-sync.js'
      - 'supabase/**'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html partner.html styles.css app.js auth.js partner.js cloud-sync.js manifest.webmanifest icon.svg www/
          mkdir -p www/supabase
          cp supabase/config.js www/supabase/config.js
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-Developers-CRM-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
