name: Build signed S.R. Developers Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'partner.html'
      - 'styles.css'
      - 'staff-control.css'
      - 'supabase/config.js'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-signed-release.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate CRM JavaScript syntax
        run: |
          node --check app.js
          node --check emi.js
          node --check cloud-sync.js
          node --check auth.js
          node --check staff-control.js
          node --check notifications.js
          node --check partner-admin.js
          node --check crm-insights.js
          node --check push-client.js
      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www/assets www/supabase
          cp index.html partner.html styles.css staff-control.css staff-control.js app.js emi.js auth.js notifications.js crm-insights.js partner.js partner-admin.js cloud-sync.js push-client.js manifest.webmanifest icon.svg sw.js www/
          cp assets/sr-developers-logo.svg www/assets/
          cp supabase/config.js www/supabase/config.js

      - name: Configure Firebase for Android push (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
            node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('google-services.json','utf8'));if(!j.project_info?.project_id||!j.client?.some(c=>c.client_info?.android_client_info?.package_name==='in.srdevelopers.crm')){console.error('Firebase JSON does not match Android package in.srdevelopers.crm');process.exit(2)}"
            echo "Firebase Android config validated."
          else
            echo "::warning::Missing GOOGLE_SERVICES_JSON_BASE64 GitHub secret. APK can build, but FCM push registration will not work on Android until Firebase config is added."
          fi
      - name: Create Android project
        run: npx cap add android

      - name: Copy Firebase config into Android app (when configured)
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi
      - name: Sync Android project
        run: npx cap sync android

      - name: Configure private release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          if ! echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sr-developers-release.jks"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is invalid or cannot be decoded"
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/sr-developers-release.jks" ]; then
            echo "::error::Decoded Android keystore is empty"
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/sr-developers-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore validation failed. Check keystore password and key alias; credentials are not printed."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sr-developers-release.jks" >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "Release signing configured. Keystore is kept in the runner's temporary directory."

      - name: Build signed release APK (retry transient Gradle failures)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Release Gradle build attempt $attempt/3"
            if ./gradlew --no-daemon --stacktrace assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done
          echo "::error::Signed release build failed after 3 attempts."
          exit 1

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: SR-Developers-CRM-Android-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
