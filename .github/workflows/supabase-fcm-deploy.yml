name: Deploy CRM FCM Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check deployment credential is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN in GitHub Actions secrets before deploying."
            exit 1
          fi
      - name: Deploy reviewed FCM Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@latest login --token "$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase@latest functions deploy register-push-device --project-ref amzqgvyslzvhcilawunc
          npx --yes supabase@latest functions deploy deliver-crm-push --project-ref amzqgvyslzvhcilawunc
