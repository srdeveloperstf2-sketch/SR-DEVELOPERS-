name: S.R. Developers CRM Email Reports

on:
  schedule:
    # 8:30 AM IST (03:00 UTC)
    - cron: "0 3 * * *"
    # 7:00 PM IST (13:30 UTC)
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      report_type:
        description: Which report to send
        required: true
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Select report type
        id: report
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.report_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 13 * * *" ]; then
            echo "type=evening" >> "$GITHUB_OUTPUT"
          else
            echo "type=morning" >> "$GITHUB_OUTPUT"
          fi
      - name: Send CRM report email
        env:
          CRM_REPORT_CRON_SECRET: ${{ secrets.CRM_REPORT_CRON_SECRET }}
          REPORT_TYPE: ${{ steps.report.outputs.type }}
        shell: bash
        run: |
          if [ -z "$CRM_REPORT_CRON_SECRET" ]; then
            echo "::error::GitHub Actions secret CRM_REPORT_CRON_SECRET is missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 25 \
            -X POST \
            "https://amzqgvyslzvhcilawunc.supabase.co/functions/v1/send-crm-report" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRM_REPORT_CRON_SECRET" \
            --data "{\"report_type\":\"$REPORT_TYPE\"}"
